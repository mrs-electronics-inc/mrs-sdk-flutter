name: Release

on:
  push:
    branches:
      - main
    paths:
      - lints/pubspec.yaml
      - pubspec.yaml

permissions:
  contents: write

jobs:
  create-tags:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.RELEASE_BOT_APP_ID }}
          private-key: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}

      - name: Configure Git remote
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${{ steps.app-token.outputs.token }}@github.com/${{ github.repository }}.git"

      - name: Create release tags
        shell: bash
        run: |
          set -euo pipefail

          before="${{ github.event.before }}"
          after="${{ github.sha }}"
          changed_files="$(git diff --name-only "$before" "$after")"
          created_any_tag=false

          tag_package() {
            local version_file="$1"
            local readme_file="$2"
            local tag_prefix="$3"
            local readme_pattern="$4"
            local version
            local readme_version
            local tag_name

            if ! printf '%s\n' "$changed_files" | grep -qxF "$version_file"; then
              return 0
            fi

            version="$(tr -d '[:space:]' < "$version_file")"
            if ! [[ "$version" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "$version_file must contain a semantic version like 0.6.0." >&2
              exit 1
            fi

            version="${version#v}"
            readme_version="$(sed -nE "$readme_pattern" "$readme_file" | head -n1)"

            if [[ -z "$readme_version" ]]; then
              echo "Could not determine the install example version in $readme_file." >&2
              exit 1
            fi

            if [[ "$readme_version" != "$version" ]]; then
              echo "README version '$readme_version' does not match package version '$version'." >&2
              exit 1
            fi

            tag_name="${tag_prefix}${version}"

            if git rev-parse -q --verify "refs/tags/${tag_name}" >/dev/null; then
              echo "Tag ${tag_name} already exists, skipping creation."
              return 0
            fi

            git tag -a "$tag_name" -m "Release ${tag_name}"
            git push origin "$tag_name"
            created_any_tag=true
          }

          tag_package \
            pubspec.yaml \
            README.md \
            v \
            's/^[[:space:]]*mrs_sdk_flutter:[[:space:]]*\^?([0-9]+\.[0-9]+\.[0-9]+).*$/\1/p'

          tag_package \
            lints/pubspec.yaml \
            lints/README.md \
            lints-v \
            's/^[[:space:]]*mrs_sdk_flutter_lints:[[:space:]]*\^?([0-9]+\.[0-9]+\.[0-9]+).*$/\1/p'

          if [[ "$created_any_tag" == false ]]; then
            echo "No package version files changed in this push."
          fi
