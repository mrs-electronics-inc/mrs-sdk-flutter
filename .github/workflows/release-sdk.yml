name: Release SDK

on:
  push:
    branches:
      - main
    paths:
      - CHANGELOG.md
      - README.md
      - docs/src/content/docs/getting-started/index.mdx
      - pubspec.yaml

permissions:
  contents: write

jobs:
  quality_gates:
    # Gate ordering: run shared quality gates before any release-specific gates.
    uses: ./.github/workflows/quality-gates.yml

  tag_version_check:
    name: tag_version_check
    runs-on: ubuntu-latest
    needs: quality_gates
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag_name: ${{ steps.version.outputs.tag_name }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate package version references
        # Failure condition: mismatched version references stop release before publish.
        id: version
        shell: bash
        run: |
          set -euo pipefail

          version="$(sed -nE 's/^version:[[:space:]]*([^+[:space:]]+).*$/\1/p' pubspec.yaml | head -n1)"

          if ! [[ "$version" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "pubspec.yaml must contain a semantic version like 0.6.0." >&2
            exit 1
          fi

          readme_version="$(sed -nE 's/^[[:space:]]*mrs_sdk_flutter:[[:space:]]*\^?([0-9]+\.[0-9]+\.[0-9]+).*$/\1/p' README.md | head -n1)"
          if [[ -z "$readme_version" ]]; then
            echo "Could not determine package version example from README.md." >&2
            exit 1
          fi

          docs_version="$(sed -nE 's/^[[:space:]]*mrs_sdk_flutter:[[:space:]]*\^?([0-9]+\.[0-9]+\.[0-9]+).*$/\1/p' docs/src/content/docs/getting-started/index.mdx | head -n1)"
          if [[ -z "$docs_version" ]]; then
            echo "Could not determine package version example from docs/src/content/docs/getting-started/index.mdx." >&2
            exit 1
          fi

          if [[ "$readme_version" != "$version" ]]; then
            echo "README version '$readme_version' does not match pubspec version '$version'." >&2
            exit 1
          fi

          if [[ "$docs_version" != "$version" ]]; then
            echo "Docs version '$docs_version' does not match pubspec version '$version'." >&2
            exit 1
          fi

          if ! grep -Eq "^##[[:space:]]+${version}$" CHANGELOG.md; then
            echo "CHANGELOG.md must contain a release heading for ${version}." >&2
            exit 1
          fi

          tag_name="v${version#v}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag_name=$tag_name" >> "$GITHUB_OUTPUT"

  dry_run_publish:
    name: dry_run_publish
    runs-on: ubuntu-latest
    needs: tag_version_check

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Verify publish readiness with dry-run
        # Failure condition: any pub.dev packaging or validation issue blocks real publish.
        run: flutter pub publish --dry-run

  create_release_tag:
    name: create_release_tag
    runs-on: ubuntu-latest
    needs:
      - dry_run_publish
      - tag_version_check

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Create release tag
        shell: bash
        run: |
          set -euo pipefail

          tag_name="${{ needs.tag_version_check.outputs.tag_name }}"

          if git rev-parse -q --verify "refs/tags/${tag_name}" >/dev/null; then
            echo "Tag ${tag_name} already exists, skipping creation."
            exit 0
          fi

          git tag -a "$tag_name" -m "Release $tag_name"
          git push origin "$tag_name"
